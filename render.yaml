# Render blueprint: one Node web service. Express serves the API and the built web app from the same origin.
# Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: artfit
    runtime: node
    plan: starter            # always on; the free plan sleeps after 15 min idle
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ARTFIT_PUBLIC
        value: "1"
      - key: VITE_PUBLIC_DEMO
        value: "1"
      - key: COSTAR_KIT_DIR
        value: kit-snapshot   # relative to server/
      - key: SNAPSHOT_REF_DATE
        value: "2026-11-10"
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_API_KEY
        sync: false
      - key: VITE_MATTERPORT_SDK_KEY
        sync: false
